name: Deploy documentation

# Publishing is opt-in for each dispatch, independent of Java releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified output to GitHub Pages
        type: boolean
        default: false
      base_path:
        description: '/ for production; /neutrino-proxy/ is available for build-only rehearsals'
        type: string
        default: /
      custom_domain:
        description: 'Production hostname; must match Settings > Pages > Custom domain'
        type: string
        default: neutrino-proxy-docs.mrsunshine.cn

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DOCS_BASE: ${{ inputs.base_path }}
      DOCS_DOMAIN: ${{ inputs.custom_domain }}
      DOCS_PUBLISH: ${{ inputs.publish }}
    defaults:
      run:
        working-directory: neutrino-proxy-vuepress
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: neutrino-proxy-vuepress/package-lock.json
      - name: Validate deployment parameters
        run: node scripts/check-pages-publish.mjs
      - run: npm ci --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: neutrino-proxy-vuepress/docs/.vitepress/dist
  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCS_BASE: /
      DOCS_TEST_URL: https://${{ inputs.custom_domain }}/
    defaults:
      run:
        working-directory: neutrino-proxy-vuepress
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: neutrino-proxy-vuepress/package-lock.json
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify public deployment and HTTPS
        run: node scripts/check-live-deployment.mjs
      - name: Verify live browser behavior
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-live-browser
          path: |
            neutrino-proxy-vuepress/playwright-report
            neutrino-proxy-vuepress/test-results
