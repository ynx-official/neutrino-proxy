server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Preserve the public host/port when a proxy or container publishes another port.
    absolute_redirect off;

    # Directory indexes keep slashless legacy URLs reachable; unknown paths are 404s.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
