<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="normal-tcp-flow-title normal-tcp-flow-desc"><title id="normal-tcp-flow-title">正常 TCP 转发：四个角色</title><desc id="normal-tcp-flow-desc">客户端主动建立服务端隧道，访问者请求经过服务端和客户端到目标，响应反向返回。</desc><style>svg{font-family:Inter,"Microsoft YaHei",Arial,sans-serif;color:#0a0a0a}text{fill:#0a0a0a}.sub{fill:#5a5a5c;font-size:16px}.tech{font-family:"Geist Mono",Consolas,monospace;font-size:16px}.node{fill:#fff;stroke:#5a5a5c;stroke-width:1.5}.focus{fill:#effcf7;stroke:#00b48a;stroke-width:2}.edge{fill:none;stroke:#5a5a5c;stroke-width:2}.muted{fill:#5a5a5c}.label{fill:#fff}</style><defs><marker id="normal-tcp-flow-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#5a5a5c"/></marker><marker id="normal-tcp-flow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#00b48a"/></marker><marker id="normal-tcp-flow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#3772cf"/></marker></defs><rect width="640" height="400" fill="#fff"/><text x="24" y="40" font-size="24" class="" text-anchor="start">TCP 转发先看这四个角色</text><text x="24" y="76" font-size="16" class="sub" text-anchor="start">先建立隧道，再转发业务字节</text><path d="M400 200 V140 Q400 132 392 132 H248 Q240 132 240 140 V200" class="edge" marker-end="url(#normal-tcp-flow-arrow)"/><rect x="220" y="100" width="200" height="24" class="label"/><text x="320" y="120" font-size="20" class="" text-anchor="middle">客户端主动建隧道</text><path d="M136 224 H184" class="edge" marker-end="url(#normal-tcp-flow-arrow)"/><path d="M184 272 H136" class="edge" stroke-dasharray="4 4" marker-end="url(#normal-tcp-flow-arrow)"/><path d="M296 224 H344" class="edge" marker-end="url(#normal-tcp-flow-arrow)"/><path d="M344 272 H296" class="edge" stroke-dasharray="4 4" marker-end="url(#normal-tcp-flow-arrow)"/><path d="M456 224 H504" class="edge" marker-end="url(#normal-tcp-flow-arrow)"/><path d="M504 272 H456" class="edge" stroke-dasharray="4 4" marker-end="url(#normal-tcp-flow-arrow)"/><rect x="24" y="200" width="112" height="96" rx="4" class="node"/><text x="80" y="240" font-size="24" class="" text-anchor="middle">访问者</text><text x="80" y="272" font-size="16" class="tech" text-anchor="middle">visitor</text><rect x="184" y="200" width="112" height="96" rx="4" class="focus"/><text x="240" y="240" font-size="24" class="" text-anchor="middle">服务端</text><text x="240" y="272" font-size="16" class="tech" text-anchor="middle">server</text><rect x="344" y="200" width="112" height="96" rx="4" class="node"/><text x="400" y="240" font-size="24" class="" text-anchor="middle">客户端</text><text x="400" y="272" font-size="16" class="tech" text-anchor="middle">Java client</text><rect x="504" y="200" width="112" height="96" rx="4" class="node"/><text x="560" y="240" font-size="24" class="" text-anchor="middle">目标服务</text><text x="560" y="272" font-size="16" class="tech" text-anchor="middle">Echo / HTTP</text><path d="M24 340 H64" class="edge" marker-end="url(#normal-tcp-flow-arrow)"/><text x="80" y="348" font-size="16" class="" text-anchor="start">业务请求</text><path d="M228 340 H188" class="edge" stroke-dasharray="4 4" marker-end="url(#normal-tcp-flow-arrow)"/><text x="244" y="348" font-size="16" class="" text-anchor="start">响应</text><text x="360" y="348" font-size="16" class="sub" text-anchor="start">上方：隧道建连方向</text></svg>