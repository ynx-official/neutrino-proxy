name: Desktop client
permissions:
  contents: read
on:
  push:
    branches: ['**']
    paths: ['neutrino-proxy-client-app/**', '.github/workflows/desktop-client.yml']
  pull_request:
    paths: ['neutrino-proxy-client-app/**', '.github/workflows/desktop-client.yml']
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: neutrino-proxy-client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: neutrino-proxy-client-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo test -p neutrino-client-core --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run desktop:build
