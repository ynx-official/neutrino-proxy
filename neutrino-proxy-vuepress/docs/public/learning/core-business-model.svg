xt x="160" y="492" font-size="16" class="tech" text-anchor="start">group_id</text><text x="160" y="516" font-size="16" class="tech" text-anchor="start">1</text><rect x="24" y="48" width="240" height="128" rx="4" class="node"/><text x="40" y="80" font-size="24" class="" text-anchor="start">user</text><path d="M24 96 H264" fill="none" stroke="#e5e5e5"/><text x="40" y="124" font-size="16" class="tech" text-anchor="start">id</text><text x="40" y="148" font-size="16" class="tech" text-anchor="start">login_name</text><rect x="376" y="48" width="240" height="128" rx="4" class="node"/><text x="392" y="80" font-size="24" class="" text-anchor="start">license</text><path d="M376 96 H616" fill="none" stroke="#e5e5e5"/><text x="392" y="124" font-size="16" class="tech" text-anchor="start">id / user_id</text><text x="392" y="148" font-size="16" class="tech" text-anchor="start">key</text><rect x="376" y="296" width="240" height="176" rx="4" class="focus"/><text x="392" y="328" font-size="24" class="" text-anchor="start">port_mapping</text><path d="M376 344 H616" fill="none" stroke="#e5e5e5"/><text x="392" y="372" font-size="16" class="tech" text-anchor="start">id / license_id</text><text x="392" y="396" font-size="16" class="tech" text-anchor="start">server_port</text><text x="392" y="420" font-size="16" class="tech" text-anchor="start">client_ip</text><text x="392" y="444" font-size="16" class="tech" text-anchor="start">client_port</text><rect x="24" y="316" width="240" height="128" rx="4" class="node"/><text x="40" y="348" font-size="24" class="" text-anchor="start">port_pool</text><path d="M24 364 H264" fill="none" stroke="#e5e5e5"/><text x="40" y="392" font-size="16" class="tech" text-anchor="start">id / group_id</text><text x="40" y="416" font-size="16" class="tech" text-anchor="start">port</text><rect x="24" y="524" width="240" height="152" rx="4" class="node"/><text x="40" y="556" font-size="24" class="" text-anchor="start">port_group</text><path d="M24 572 H264" fill="none"